name: Build
on: [push, pull_request]

env:
  PYINSTALLER_PYTHON_VERSION: 3.14

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: astral-sh/setup-uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Virtual Environment
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install Dependencies
        run: uv sync --extra desktop --extra dbsupp --extra docker --group dev
      - name: Install Pyright
        run: npm install -g pyright@">1.1.376||<1.1.376"
      - name: Check Black Formatter
        run: uv run black -l 120 --check .
      - name: Check Pyright Syntax
        run: npx pyright --pythonpath .venv/bin/python

  artifact-docker:
    runs-on: ${{ matrix.runs-on }}
    needs: syntax-check
    strategy:
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm]
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Build Docker Images
      run: docker build -t npps4 .
    - name: Export Docker Images
      run: docker save npps4 | gzip > npps4.tar.gz
    - name: Artifact
      uses: actions/upload-artifact@v7
      with:
        name: npps4-docker-${{ runner.arch }}
        path: npps4.tar.gz
        if-no-files-found: error

  pyinstaller:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            name: ubuntu-x86-64
          - runner: ubuntu-24.04-arm
            name: ubuntu-arm64
          - runner: windows-latest
            name: windows-amd64
          - runner: windows-11-arm
            name: windows-arm64
          - runner: macos-15-intel
            name: macos-intel
          - runner: macos-15
            name: apple-silicon
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    needs: syntax-check
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        python-version: ${{ env.PYINSTALLER_PYTHON_VERSION }}
    - name: Setup Virtual Environment
      run: uv venv --python ${{ env.PYINSTALLER_PYTHON_VERSION }}
    - name: Install Dependencies
      run: uv sync --extra desktop --extra dbsupp --group dev
    - name: Make Bundle
      env:
        NPPS4_CONFIG_DOWNLOAD_N4DLAPI_SERVER: ${{ secrets.NPPS4_CONFIG_DOWNLOAD_N4DLAPI_SERVER }}
      run: uv run pyinstaller npps4.spec
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pyinstaller-npps4-${{ matrix.name }}
        path: dist
        if-no-files-found: error

  upload-release:
    runs-on: ubuntu-latest
    needs: [pyinstaller, artifact-docker]
    if: ${{ (github.event_name == 'push' && github.ref_name == 'master') }}
    steps:
    - name: Install Zip
      run: sudo apt-get install --assume-yes zip curl libfuse2
    - name: Download pyuploadtool
      run: curl -LO https://github.com/TheAssassin/pyuploadtool/releases/download/continuous/pyuploadtool-x86_64.AppImage && chmod +x pyuploadtool-x86_64.AppImage
    - name: Download Artifacts
      uses: actions/download-artifact@v6
    - name: List All Files
      run: ls -alFR
    - name: Zip Files
      run: |
        set -e
        for dir in pyinstaller-npps4-*/; do
          name="${dir%/}"
          (cd "$dir" && zip -r9 "../${name}.zip" .)
        done
        mv npps4-docker-X64/npps4.tar.gz npps4-dockerimage-x86-64.tar.gz
        mv npps4-docker-ARM64/npps4.tar.gz npps4-dockerimage-aarch64.tar.g
    - name: Upload to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_CONTINUOUS_RELEASE_TYPE: prerelease
        GITHUB_CONTINUOUS_RELEASE_NAME: Continuous Build
        GITHUB_CONTINUOUS_RELEASE_TAG: continuous
      run: ./pyuploadtool-x86_64.AppImage pyinstaller-npps4-*.zip npps4-dockerimage-*.tar.gz
